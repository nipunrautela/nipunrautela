<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="GitHub stats for nipunrautela: 388 public commits, 12 stars earned, 70 pull requests, 28 public repos, 14 followers, 2020 on github since. Top languages: Python 34.7 percent, Astro 14.7 percent, ShaderLab 13.3 percent, JavaScript 8.8 percent, PHP 7.5 percent, TypeScript 7.5 percent, Dart 6.9 percent, C++ 6.7 percent.">
  <title>GitHub stats</title>

  <defs>
