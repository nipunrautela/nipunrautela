      .tile { fill: #121A23; stroke: #8B98A6; stroke-opacity: 0.14; }
      .lbl  { font-size: 11px; letter-spacing: 2px; fill: #8B98A6; }
      .val  { font-size: 30px; font-weight: 800; }
      .lang { font-size: 14.5px; fill: #C7D0DA; }
      .pct  { font-size: 12.5px; fill: #8B98A6; }
