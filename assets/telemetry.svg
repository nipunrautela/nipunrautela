<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 478" width="1200" height="478" role="img" aria-label="Track record: nightly batch runtime 5.5h to 3.0h (45% faster); platform execution overhead down 60%; scheduler trigger lag plus-minus 20s to plus-minus 5s with zero misfires; deployment effort down 80%; blue-green AKS migration 90% automated; code smell down 70%.">
  <title>Track record — measured outcomes from shipped work</title>

  <defs>
    <linearGradient id="tcarbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#0F151D"/>
    </linearGradient>
    <linearGradient id="meterFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3DDC97"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <clipPath id="tframe"><rect width="1200" height="478" rx="14"/></clipPath>
    <style>
      .sans  { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono  { font-family: "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
      .label { font-size: 11.5px; letter-spacing: 2px; fill: #8B98A6; }
      .value { font-size: 36px; font-weight: 700; fill: #FFFFFF; }
      .sub   { font-size: 13px; fill: #8B98A6; }
      .tile  { fill: #121A23; stroke: #8B98A6; stroke-opacity: 0.14; }
      .track { fill: #1B3B30; }
      .grow  { transform-origin: left center; animation: grow 1.5s cubic-bezier(.22,.9,.28,1) both; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <g clip-path="url(#tframe)">
    <rect width="1200" height="478" fill="url(#tcarbon)"/>

    <!-- panel header -->
    <rect x="24" y="30" width="4" height="26" rx="2" fill="#3DDC97"/>
    <text class="sans" x="40" y="51" font-size="20" font-weight="700" fill="#FFFFFF">Track record</text>
    <text class="mono" x="1176" y="50" text-anchor="end" font-size="11.5" letter-spacing="2" fill="#6B7684">MEASURED · SHIPPED WORK</text>
    <rect x="24" y="68" width="1152" height="1" fill="#8B98A6" fill-opacity="0.14"/>

    <!-- ROW 1 -->
    <g transform="translate(24,86)">
      <rect class="tile" width="368" height="170" rx="12"/>
      <text class="mono label" x="24" y="36">NIGHTLY BATCH RUNTIME</text>
      <text class="sans value" x="24" y="88">5.5h → 3.0h</text>
      <text class="sans sub" x="24" y="114">45% faster · pl/pgsql + C-shell parallelised</text>
      <rect class="track" x="24" y="134" width="320" height="6" rx="3"/>
      <rect class="grow" x="24" y="134" width="144" height="6" rx="3" fill="url(#meterFill)"/>
    </g>

    <g transform="translate(416,86)">
      <rect class="tile" width="368" height="170" rx="12"/>
      <text class="mono label" x="24" y="36">PLATFORM EXECUTION OVERHEAD</text>
      <text class="sans value" x="24" y="88">−60%</text>
      <text class="sans sub" x="24" y="114">monolith → event-driven processors</text>
      <rect class="track" x="24" y="134" width="320" height="6" rx="3"/>
      <rect class="grow" x="24" y="134" width="192" height="6" rx="3" fill="url(#meterFill)"/>
    </g>

    <g transform="translate(808,86)">
      <rect class="tile" width="368" height="170" rx="12"/>
      <text class="mono label" x="24" y="36">SCHEDULER TRIGGER LAG</text>
      <text class="sans value" x="24" y="88">±20s → ±5s</text>
      <text class="sans sub" x="24" y="114">cross-region dual-DC · misfires to zero</text>
      <rect class="track" x="24" y="134" width="320" height="6" rx="3"/>
      <rect class="grow" x="24" y="134" width="240" height="6" rx="3" fill="url(#meterFill)"/>
    </g>

    <!-- ROW 2 -->
    <g transform="translate(24,280)">
      <rect class="tile" width="368" height="170" rx="12"/>
      <text class="mono label" x="24" y="36">DEPLOYMENT EFFORT</text>
      <text class="sans value" x="24" y="88">−80%</text>
      <text class="sans sub" x="24" y="114">Azure AKS provisioning automated</text>
      <rect class="track" x="24" y="134" width="320" height="6" rx="3"/>
      <rect class="grow" x="24" y="134" width="256" height="6" rx="3" fill="url(#meterFill)"/>
    </g>

    <g transform="translate(416,280)">
      <rect class="tile" width="368" height="170" rx="12"/>
      <text class="mono label" x="24" y="36">BLUE-GREEN AKS MIGRATION</text>
      <text class="sans value" x="24" y="88">90%</text>
      <text class="sans sub" x="24" y="114">automated · 3× migration efficiency</text>
      <rect class="track" x="24" y="134" width="320" height="6" rx="3"/>
      <rect class="grow" x="24" y="134" width="288" height="6" rx="3" fill="url(#meterFill)"/>
    </g>

    <g transform="translate(808,280)">
      <rect class="tile" width="368" height="170" rx="12"/>
      <text class="mono label" x="24" y="36">CODE SMELL</text>
      <text class="sans value" x="24" y="88">−70%</text>
      <text class="sans sub" x="24" y="114">re-architecture with zero-downtime cutover</text>
      <rect class="track" x="24" y="134" width="320" height="6" rx="3"/>
      <rect class="grow" x="24" y="134" width="224" height="6" rx="3" fill="url(#meterFill)"/>
    </g>
  </g>
</svg>
