name: Refresh stats

on:
  schedule:
    # 04:10 UTC daily. Off the hour so it is not queued behind everyone else's cron.
    - cron: "10 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "Refresh stats panel"
          git push
